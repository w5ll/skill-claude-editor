let opcoesDesenhadas = "";
function desenharNova(estado) {
  const o = estado.opcoes || {series: [], perfis: []};
  const chave = JSON.stringify(o);
  if (chave !== opcoesDesenhadas) {
    opcoesDesenhadas = chave;
    $("#nova-serie").innerHTML = `<option value="">nenhuma (padrões da skill)</option>` + o.series.map((x) => `<option>${esc(x)}</option>`).join("");
    $("#nova-perfil").innerHTML = `<option value="">padrão</option>` + o.perfis.map((x) => `<option>${esc(x)}</option>`).join("");
  }
  const existentes = new Set(estado.brutos.map((b) => b.nome));
  [...selecionados].forEach((n) => { if (!existentes.has(n)) selecionados.delete(n); });
  $("#escolhidos").textContent = selecionados.size ? `Vídeos escolhidos: ${[...selecionados].join(" + ")}` :
    "Marque os vídeos que formam a edição (nos vídeos brutos acima).";
  $("#nova-comecar").disabled = !selecionados.size;
}

const SIMB = {feita: "✓", pulada: "–", pendente: "·", rodando: "▶", interrompida: "↺", falhou: "✗", desatualizada: "↻"};
const limpaMd = (t) => t.replace(/\*\*/g, "").replace(/`/g, "").replace(/_\(([^)]*)\)_/g, "($1)");

function formCartao(t) {
  const g = t.orq.portao, c = g.cartao, e = t.orq.escolhas;
  const pend = c.pendencias.map((p) => `<div class="pend"><div class="q">${esc(p.pergunta)}</div>` + p.opcoes.map((op) =>
    `<label class="opcao"><input type="radio" name="p-${esc(t.nome)}-${esc(p.id)}" value="${op.letra}" ${op.recomendada ? "checked" : ""}>
      <span><b>${op.letra})</b> ${esc(op.texto)}${op.recomendada ? "<small>recomendado</small>" : ""}</span></label>`).join("") + `</div>`).join("");
  const avisos = c.avisos.length ? `<div class="avisos">${c.avisos.map((a) => "⚠ " + esc(a)).join("<br>")}</div>` : "";
  const linhas = (g.texto || "").split("\n").filter((l) => l.startsWith("- ") && !l.includes("Preciso") && !l.startsWith("- Aviso") &&
    !/^- O vídeo está|^- Tem chiado/.test(l)).map((l) => `<li>${esc(limpaMd(l.slice(2)).replace(/\S*\/(\S+\.mp4)/, "$1"))}</li>`).join("");
  const sel = (chave, rotulo, opcoes, atual) => `<div><label class="c">${rotulo}</label><select data-escolha="${chave}" data-atual="${esc(atual)}">` +
    opcoes.map(([v, n]) => `<option value="${v}" ${v === atual ? "selected" : ""}>${n}</option>`).join("") + `</select></div>`;
  const marcar = (chave, rotulo, atual) => `<label class="marcar"><input type="checkbox" data-escolha="${chave}" data-atual="${atual}" ${atual ? "checked" : ""}> ${rotulo}</label>`;
  const rapido = `<details class="rapido"><summary>Ajustes rápidos</summary><div class="grade2">
      ${sel("ritmo", "Ritmo", [["natural", "natural"], ["dinamico", "dinâmico"]], e.ritmo)}
      ${sel("camera", "Zoom de ênfase", [["nenhum", "sem zoom"], ["leve", "leve"], ["normal", "normal"], ["forte", "forte"]], e.camera)}
      ${sel("som.musica", "Música", [["nenhuma", "sem música"], ["calmo", "calma"], ["animado", "animada"], ["batida", "batida leve"]], e.som.musica)}
      ${sel("amostra", "Amostra", [["conferir", "eu confiro"], ["aprovar", "você aprova"], ["nao", "sem amostra"]], e.amostra)}
      ${marcar("som.efeitos", "efeito sonoro nos elementos", !!e.som.efeitos)}
      ${marcar("legenda.ligada", "legenda", e.legenda.ligada !== false)}
      ${marcar("elementos.ligado", "elementos 3D", e.elementos.ligado !== false)}
    </div></details>`;
  return `${pend}${avisos}<ul class="linhas">${linhas}</ul>${rapido}
    <div class="botoes"><button class="primario" data-acao="aprovar-cartao" data-pasta="${esc(t.nome)}">Aprovar e começar</button></div>`;
}

function pedidoDoClaude(t, g) {
  return `Revise o portão "${g.nome}" da edição ${t.nome} (projeto welldit). Rode: python skill/welldit/scripts/editar.py estado --pasta saida/${t.nome}. ` +
    `Leia o pedido em saida/${t.nome}/pedidos/${g.nome}.json e a referência da skill, faça a revisão e depois aprove com: ` +
    `python skill/welldit/scripts/editar.py aprovar --pasta saida/${t.nome} ${g.nome} --seguir`;
}

function desenharPortao(t) {
  const g = t.orq.portao;
  if (!g || t.orq.posicao !== null) return "";
  if (g.nome === "cartao") return `<div class="portao"><h3>Cartão de ajustes</h3>${formCartao(t)}</div>`;
  const arqs = g.arquivos.map((a) => `<a href="${url(a.caminho)}" target="_blank" rel="noopener">${esc(a.nome)}</a>`).join(" · ");
  const amostra = g.nome === "amostra" ? t.versoes.find((v) => v.amostra && v.pronta) : null;
  return `<div class="portao"><h3>${esc(g.pergunta)}</h3>
    ${arqs ? `<div class="extras">Arquivos: ${arqs}</div>` : ""}
    ${g.nome === "cortes" || g.nome === "legenda" ? `<div class="extras">Revise na tela: ${g.nome === "cortes" ? "a fala com o que fica e o que sai, as suspeitas, e ouça as emendas" : "o texto de cada bloco, com a prévia"}.</div>` :
      g.nome === "elementos" ? `<div class="extras">Revise na tela: cada elemento com a prévia, o momento, o rótulo e a troca.</div>` :
      g.nome === "problemas" ? `<div class="extras">Corrija na tela: aceitar uma pausa, aplicar o ganho sugerido ou refazer o vídeo.</div>` :
      g.tipo === "julgamento" ? `<div class="extras">Este portão se revisa na conversa com o Claude. Se você já decidiu, aprove aqui.</div>` : ""}
    <div class="botoes">
      ${g.nome === "cortes" || g.nome === "legenda" ? `<button class="primario" data-acao="revisar" data-tipo="${esc(g.nome)}" data-pasta="${esc(t.nome)}">${g.nome === "cortes" ? "Revisar os cortes" : "Revisar a legenda"}</button>` : ""}
      ${g.nome === "elementos" || g.nome === "problemas" ? `<button class="primario" data-acao="ajustar" data-aba="${g.nome === "elementos" ? "elementos" : "conferencia"}" data-pasta="${esc(t.nome)}">${g.nome === "elementos" ? "Revisar os elementos" : "Ver os problemas e corrigir"}</button>` : ""}
      ${amostra ? `<button data-video="${esc(amostra.caminho)}" data-nome="${esc(amostra.nome)}">assistir a amostra</button>` : ""}
      <button class="primario" data-acao="aprovar" data-pasta="${esc(t.nome)}" data-portao="${esc(g.nome)}">${g.nome === "amostra" ? "Aprovar a amostra e seguir" : "Aprovar e seguir"}</button>
      <button data-copiar-texto="${esc(pedidoDoClaude(t, g))}">Copiar pedido para o Claude</button>
    </div></div>`;
}

function desenharOrq(t, versoes) {
  const o = t.orq;
  const chips = Object.values(o.etapas).map((e) => `<span class="etapa ${e.situacao === "feita" ? "feito" : e.situacao}" title="${esc(e.resumo)}">${e.situacao === "feita" ? "" : SIMB[e.situacao] + " "}${esc(e.titulo)}${e.situacao === "feita" && e.resumo && e.resumo.length <= 30 ? `<small>${esc(e.resumo)}</small>` : ""}</span>`).join("");
  const a = t.agora;
  let andando = "";
  if (o.posicao === 0) {
    const pct = a && a.situacao === "rodando" && a.progresso != null ? Math.round(a.progresso * 100) + "%" : "";
    andando = `<div class="agora"><div class="linha1"><i class="gira"></i>${a && a.situacao === "rodando" ? esc(capital(a.etapa)) : "Rodando"}<span class="pct">${pct}</span></div>
      <div class="det">${esc((a && a.detalhe) || "")}</div>
      ${pct ? `<div class="barra"><i style="width:${(a.progresso * 100).toFixed(1)}%"></i></div>` : ""}
      <div class="botoes"><button class="perigo" data-acao="cancelar" data-pasta="${esc(t.nome)}">Cancelar</button></div></div>`;
  } else if (o.posicao > 0) {
    andando = `<div class="fila-linha"><i class="gira"></i>na fila, posição ${o.posicao}
      <button class="mini perigo" data-acao="cancelar" data-pasta="${esc(t.nome)}">Tirar da fila</button></div>`;
  }
  const incompleta = o.etapas.entrega.situacao !== "feita";
  const parada = Object.values(o.etapas).some((e) => ["interrompida", "falhou", "desatualizada"].includes(e.situacao));
  const controles = o.posicao === null ? `<div class="botoes">
      ${!o.portao && incompleta ? `<button class="primario" data-acao="iniciar" data-pasta="${esc(t.nome)}">${parada ? "Retomar" : "Continuar"}</button>` : ""}
      ${o.revisar && o.revisar.cortes && !(o.portao && o.portao.nome === "cortes") ? `<button data-acao="revisar" data-tipo="cortes" data-pasta="${esc(t.nome)}">Revisar cortes</button>` : ""}
      ${o.revisar && o.revisar.legenda && !(o.portao && o.portao.nome === "legenda") ? `<button data-acao="revisar" data-tipo="legenda" data-pasta="${esc(t.nome)}">Revisar legenda</button>` : ""}
      ${o.ajustar && o.ajustar.elementos && !(o.portao && o.portao.nome === "elementos") ? `<button data-acao="ajustar" data-aba="elementos" data-pasta="${esc(t.nome)}">Ajustar elementos</button>` : ""}
      ${o.ajustar && o.ajustar.zoom ? `<button data-acao="ajustar" data-aba="zoom" data-pasta="${esc(t.nome)}">Ajustar zoom</button>` : ""}
      ${o.ajustar && o.ajustar.som ? `<button data-acao="ajustar" data-aba="som" data-pasta="${esc(t.nome)}">Ajustar som</button>` : ""}
      ${o.ajustar && o.ajustar.conferencia && !(o.portao && o.portao.nome === "problemas") ? `<button data-acao="ajustar" data-aba="conferencia" data-pasta="${esc(t.nome)}">Ver a conferência</button>` : ""}
      <button data-acao="abrir" data-pasta="${esc(t.nome)}">Abrir a pasta</button></div>` : "";
  const ult = o.ultimo && ["falhou", "erro"].includes(o.ultimo.resultado) ? `<div class="erro-rodada">A última rodada terminou com problema: ${esc((o.ultimo.linhas || []).slice(-1)[0] || "")}</div>` : "";
  return `<div class="cab"><span class="titulo">${esc(t.nome)}</span>
      <span class="quando">${esc(t.videos.join(" + "))}${t.videos.length ? " · " : ""}${o.serie ? "série " + esc(o.serie) + " · " : ""}atualizado ${quando(t.modificado)}</span></div>
    <div class="etapas">${chips}</div>
    ${andando}${ult}${desenharPortao(t)}${controles}
    ${o.entrega_aprovada ? `<div class="extras">Entrega aprovada: ${esc(o.entrega_aprovada.arquivo)}</div>` : ""}
    ${versoes ? `<div class="versoes">${versoes}</div>` : ""}`;
}

function desenharTrabalho(t) {
  const conferida = t.etapas.find((e) => e.chave === "conferencia");
  const etapas = t.etapas.map((e) => {
    const falhou = e.chave === "conferencia" && !e.feito && e.detalhe === "com problema";
    return `<span class="etapa ${e.feito ? "feito" : ""} ${falhou ? "falha" : ""}">${esc(e.nome)}${e.detalhe ? `<small>${esc(e.detalhe)}</small>` : ""}</span>`;
  }).join("");
  let agora = "";
  const a = t.agora;
  if (a && a.situacao === "rodando") {
    const pct = a.progresso == null ? "" : Math.round(a.progresso * 100) + "%";
    agora = `<div class="agora"><div class="linha1"><i class="gira"></i>${esc(capital(a.etapa))}<span class="pct">${pct}</span></div>
      <div class="det">${esc(a.detalhe || "")}</div>
      ${a.progresso == null ? "" : `<div class="barra"><i style="width:${(a.progresso * 100).toFixed(1)}%"></i></div>`}</div>`;
  } else if (a && a.situacao === "parou") {
    agora = `<div class="agora parou"><div class="linha1">Parou em: ${esc(a.etapa)}</div>
      <div class="det">O script não terminou. Veja a conversa no Claude Code (pode ter dado erro, ou o limite de uso acabou).</div></div>`;
  } else if (a && a.situacao === "concluido") {
    agora = `<div class="extras">Última etapa: ${esc(a.etapa)}${a.detalhe ? " · " + esc(a.detalhe) : ""} · ${quando(a.atualizado)}</div>`;
  }
  const versoes = t.versoes.map((v, k) => {
    const c = v.conferencia;
    const selo = c ? `<span class="selo ${c.aprovado ? "ok" : "falha"}">${c.aprovado ? "aprovado" : "com problema"}</span>` : "";
    const checks = c ? `<ul class="checks" id="ck-${esc(t.nome)}-${k}">${c.checks.map((x) =>
      `<li class="${x.ok ? "" : "f"}">${x.ok ? "✓" : "✗"} <b>${esc(x.item)}</b>: ${esc(x.detalhe)}</li>`).join("")}</ul>` : "";
    if (!v.pronta) return `<div class="versao">
      <div class="nome"><b>${esc(v.nome)}</b><span>gravando... ${tamanho(v.tamanho)}</span></div><div class="acoes"></div></div>`;
    return `<div class="versao">
      <div class="nome"><b>${esc(v.nome)}</b>${selo}<span>${tamanho(v.tamanho)} · ${quando(v.modificado)}</span></div>
      <div class="acoes">
        <button data-video="${esc(v.caminho)}" data-nome="${esc(v.nome)}">assistir</button>
        ${v.quadros ? `<button data-img="${esc(v.quadros)}" data-nome="quadros de ${esc(v.nome)}">quadros</button>` : ""}
        ${v.emendas.map((e, j) => `<button data-img="${esc(e)}" data-nome="emendas ${j + 1} de ${esc(v.nome)}">emendas${v.emendas.length > 1 ? " " + (j + 1) : ""}</button>`).join("")}
        ${c ? `<button data-checks="ck-${esc(t.nome)}-${k}">conferência</button>` : ""}
        ${t.orq && !v.amostra ? (t.orq.entrega_aprovada && t.orq.entrega_aprovada.arquivo === v.nome ? `<span class="selo ok">entrega aprovada</span>` :
          `<button data-acao="aprovar-entrega" data-pasta="${esc(t.nome)}" data-arquivo="${esc(v.nome)}">aprovar entrega</button>`) : ""}
      </div>${checks}</div>`;
  }).join("");
  if (t.orq) return desenharOrq(t, versoes);
  return `<div class="cab"><span class="titulo">${esc(t.nome)}</span>
      <span class="quando">${esc(t.videos.join(" + "))}${t.videos.length ? " · " : ""}atualizado ${quando(t.modificado)}</span></div>
    <div class="etapas">${etapas}</div>
    ${t.extras.length ? `<div class="extras">Com ${esc(t.extras.join(", "))}</div>` : ""}
    ${agora}
    ${versoes ? `<div class="versoes">${versoes}</div>` : ""}`;
}
const capital = (s) => s ? s[0].toUpperCase() + s.slice(1) : "";

function desenharTrabalhos(estado) {
  const caixa = $("#trabalhos");
  if (!estado.trabalhos.length) { caixa.innerHTML = `<p class="vazio">Nenhuma edição em saida ainda. Envie um vídeo e peça a edição no Claude Code.</p>`; ultimos = {}; return; }
  const vistos = new Set();
  estado.trabalhos.forEach((t, ordem) => {
    vistos.add(t.nome);
    const chave = JSON.stringify(t);
    let el = document.getElementById("t-" + t.nome);
    if (!el) { el = document.createElement("div"); el.className = "cartao trabalho"; el.id = "t-" + t.nome; }
    if (caixa.children[ordem] !== el) caixa.insertBefore(el, caixa.children[ordem] || null);
    if (ultimos[t.nome] !== chave) {
      const abertos = [...el.querySelectorAll(".checks.aberto")].map((x) => x.id);
      el.innerHTML = desenharTrabalho(t);
      abertos.forEach((id) => document.getElementById(id)?.classList.add("aberto"));
      ultimos[t.nome] = chave;
    }
  });
  [...caixa.children].forEach((el) => { if (!vistos.has(el.id?.slice(2))) el.remove(); });
  caixa.querySelector(".vazio")?.remove();
}

/* Perfil de marca: nome, cores e créditos vêm de perfis/NOME/marca.json (o painel padrão é o do perfil arven). */
async function aplicarMarca() {
  try {
    const m = await (await fetch("/marca.json", {cache: "no-store"})).json();
    const c = m.cores || {}, raiz = document.documentElement.style;
    const mapa = {"--fundo": "fundo", "--fundo-profundo": "fundo_profundo", "--cartao": "cartao", "--linha": "linha",
      "--destaque": "destaque", "--texto": "texto", "--apoio": "apoio", "--rotulo": "rotulo", "--metal": "elemento_3d"};
    for (const [variavel, chave] of Object.entries(mapa)) if (c[chave]) raiz.setProperty(variavel, c[chave]);
    document.getElementById("marca-nome").textContent = m.nome || "";
    document.getElementById("rodape").textContent = m.creditos || "";
    document.title = m.nome ? `welldit · ${m.nome}` : "welldit";
  } catch (e) { /* sem perfil: fica o visual padrão do arquivo */ }
}

async function atualizar() {
  try {
    const r = await fetch("/api/estado", {cache: "no-store"});
    if (r.status === 401) { location.reload(); return; }
    const estado = await r.json();
    ultimoEstado = estado;
    desenharBrutos(estado); desenharNova(estado); desenharTrabalhos(estado); desenharChipClaude();
    if (rev.tipo) $("#rev-aprovar").style.display = portaoAbertoDa(rev.tipo) ? "" : "none";
    if (aj.aba) botoesDoAjuste();
    $("#bolinha").classList.remove("fora"); $("#conexao").textContent = "atualizando ao vivo";
  } catch {
    $("#bolinha").classList.add("fora"); $("#conexao").textContent = "painel desligado: rode o painel.py";
  }
}

/* ---------- cliques ---------- */
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("button");
  if (!b) return;
  if (b.dataset.copiar) copiar(pedidoPara(b.dataset.copiar));
  if (b.dataset.copiarTexto) copiar(b.dataset.copiarTexto);
  const pasta = b.dataset.pasta;
  switch (b.dataset.acao) {
    case "aprovar-cartao": {
      const caixa = b.closest(".portao");
      const resposta = [...caixa.querySelectorAll("input[type=radio]:checked")].map((i) => i.value).join(",");
      const escolhas = [];
      caixa.querySelectorAll("[data-escolha]").forEach((el) => {
        let valor = el.type === "checkbox" ? el.checked : el.value;
        if (String(valor) !== el.dataset.atual) escolhas.push({chave: el.dataset.escolha, valor});
      });
      b.disabled = true;
      agir("/api/aprovar", {pasta, portao: "cartao", resposta, escolhas, seguir: true}, "Cartão aprovado. A edição começou.").finally(() => { b.disabled = false; });
      break;
    }
    case "aprovar": agir("/api/aprovar", {pasta, portao: b.dataset.portao, seguir: true}, "Aprovado. Seguindo."); break;
    case "iniciar": agir("/api/iniciar", {pasta}, "Na fila."); break;
    case "cancelar": agir("/api/cancelar", {pasta}, "Cancelado."); break;
    case "abrir": agir("/api/abrir-pasta", {pasta}); break;
    case "revisar": abrirRevisao(b.dataset.tipo, pasta); break;
    case "ajustar": abrirAjustes(b.dataset.aba, pasta); break;
    case "aprovar-entrega": agir("/api/aprovar-entrega", {pasta, arquivo: b.dataset.arquivo}, "Entrega aprovada."); break;
  }
  if (b.id === "nova-comecar") {
    const corpo = {videos: [...selecionados], tema: $("#nova-tema").value.trim() || null, serie: $("#nova-serie").value || null,
      perfil: $("#nova-perfil").value || null, iniciar: true};
    b.disabled = true;
    agir("/api/novo", corpo, "Edição criada. A inspeção começou.").then((d) => { if (d) { selecionados.clear(); $("#nova-tema").value = ""; ultimoBrutos = ""; } }).finally(() => { atualizar(); });
  }
  if (b.dataset.checks) document.getElementById(b.dataset.checks)?.classList.toggle("aberto");
  if (b.dataset.video) abrir(b.dataset.nome, `<video src="${url(b.dataset.video)}" controls autoplay playsinline></video>`);
  if (b.dataset.img) abrir(b.dataset.nome, `<img src="${url(b.dataset.img)}" alt="">`);
});
function abrir(nome, html) { $("#modal-nome").textContent = nome; $("#modal-corpo").innerHTML = html; $("#modal").classList.add("aberto"); }
function fechar() { $("#modal").classList.remove("aberto"); $("#modal-corpo").innerHTML = ""; }
$("#fechar").onclick = fechar;
$("#modal").addEventListener("click", (ev) => { if (ev.target.id === "modal") fechar(); });
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") fechar(); });
document.addEventListener("change", (ev) => {
  const c = ev.target.closest("input[data-usar]");
  if (!c) return;
  if (c.checked) selecionados.add(c.dataset.usar); else selecionados.delete(c.dataset.usar);
  $("#escolhidos").textContent = selecionados.size ? `Vídeos escolhidos: ${[...selecionados].join(" + ")}` : "Marque os vídeos que formam a edição (nos vídeos brutos acima).";
  $("#nova-comecar").disabled = !selecionados.size;
});

aplicarMarca();
atualizar();
setInterval(atualizar, 2000);
</script>
</body>
