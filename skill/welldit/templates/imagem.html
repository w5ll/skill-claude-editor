<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Sora ExtraBold"; src: url("../assets/fontes/Sora-ExtraBold.ttf"); }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #palco { position: relative; overflow: hidden; }
  #cartao { position: absolute; overflow: hidden; will-change: transform, opacity; }
  #foto { width: 100%; height: 100%; object-fit: cover; display: block; will-change: transform; }
  #pelicula { position: absolute; inset: 0; pointer-events: none; }
  #texto { position: absolute; text-align: center; font-family: var(--fonte, "Sora ExtraBold"); color: var(--texto);
           line-height: 1.08; letter-spacing: -0.01em; text-shadow: 0 2px 16px rgba(10, 10, 18, .8); }
  #texto b { color: var(--destaque); font-weight: inherit; }
</style>
</head>
<body>
<div id="palco"><div id="cartao"><img id="foto" alt=""><div id="pelicula"></div></div><div id="texto"></div></div>
<script>
/* Imagem de apoio no vídeo, com a mesma entrada (0,45 s) e saída (0,3 s) dos elementos 3D.
   cfg: {modo: "sobreposto"|"tela", largura, altura, duracao, texto, cores, imagem (data URI)}.
   desenhar(t) posiciona tudo no instante t (segundos), para gerar cada quadro de forma exata. */
let CFG, LADO;
const limitar = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const saidaCubica = x => 1 - Math.pow(1 - x, 3);
const saidaVolta = x => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function montar(cfg) {
  CFG = cfg; const C = cfg.cores;
  const raiz = document.documentElement.style;
  raiz.setProperty('--texto', C.texto); raiz.setProperty('--destaque', C.destaque);
  if (cfg.fonte) {   // fonte do perfil de marca (o arquivo vem de fora; a família é só um nome interno)
    const st = document.createElement('style');
    st.textContent = `@font-face { font-family: "FontePerfil"; src: url("${cfg.fonte.url}"); }`;
    document.head.appendChild(st);
    raiz.setProperty('--fonte', '"FontePerfil", "Sora ExtraBold", sans-serif');
  }
  const palco = document.getElementById('palco');
  palco.style.width = cfg.largura + 'px'; palco.style.height = cfg.altura + 'px';
  const cartao = document.getElementById('cartao'), txt = document.getElementById('texto');
  const foto = document.getElementById('foto'), pel = document.getElementById('pelicula');
  foto.src = cfg.imagem;
  await foto.decode();
  txt.innerHTML = esc(cfg.texto || '').replace(/\*([^*]+)\*/g, '<b>$1</b>');
  if (cfg.modo === 'tela') {
    Object.assign(cartao.style, { left: 0, top: 0, width: cfg.largura + 'px', height: cfg.altura + 'px' });
    pel.style.background = `linear-gradient(to top, ${C.fundo_profundo}f2 0%, ${C.fundo_profundo}99 22%, transparent 52%), ${C.fundo_profundo}38`;
    Object.assign(txt.style, { left: '8%', right: '8%', bottom: (cfg.altura * 0.2) + 'px', fontSize: (cfg.largura * 0.075) + 'px' });
  } else {
    LADO = cfg.largura;
    Object.assign(cartao.style, { left: 0, top: 0, width: LADO + 'px', height: LADO + 'px',
      borderRadius: (LADO * 0.07) + 'px', border: `2px solid ${C.linha}`, boxSizing: 'border-box',
      boxShadow: '0 18px 40px rgba(10, 10, 18, .55)' });
    pel.style.background = `linear-gradient(to bottom, rgba(255,255,255,.10), transparent 35%)`;
    Object.assign(txt.style, { left: '4%', right: '4%', top: (LADO * 1.04) + 'px', fontSize: (LADO * 0.085) + 'px' });
  }
  await document.fonts.ready;
}

function desenhar(t) {
  const dur = CFG.duracao;
  const e = limitar(t / 0.45);
  const s = limitar((t - (dur - 0.3)) / 0.3);
  const cartao = document.getElementById('cartao'), foto = document.getElementById('foto');
  const txt = document.getElementById('texto'), palco = document.getElementById('palco');
  if (CFG.modo === 'tela') {
    // como um corte: entra e sai rápido, e a foto se aproxima devagar enquanto fica na tela
    palco.style.opacity = limitar(t / 0.12) * (1 - limitar((t - (dur - 0.12)) / 0.12));
    foto.style.transform = `scale(${1 + 0.06 * limitar(t / dur)})`;
  } else {
    const escala = (0.55 + 0.45 * saidaVolta(e)) * (1 - 0.18 * saidaCubica(s));
    const dy = (1 - saidaCubica(e)) * LADO * 0.15 + Math.sin(t * 2.6) * LADO * 0.012;
    cartao.style.opacity = limitar(e * 2) * (1 - s);
    cartao.style.transform = `translateY(${dy}px) scale(${escala})`;
  }
  const et = limitar((t - 0.18) / 0.35);
  txt.style.opacity = limitar(et * 1.5) * (1 - s);
  txt.style.transform = `translateY(${(1 - saidaCubica(et)) * 30}px)`;
}
</script>
</body>
</html>
