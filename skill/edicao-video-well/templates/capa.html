<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<style>
  @font-face { font-family: "Sora ExtraBold"; src: url("../assets/fontes/Sora-ExtraBold.ttf"); }
  html, body { margin: 0; padding: 0; background: #0a0a12; }
  #capa { position: relative; overflow: hidden; }
  #fundo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #faixa { position: absolute; left: 0; right: 0; }
  #zona { position: absolute; display: flex; align-items: center; justify-content: center; text-align: center; }
  #titulo { font-family: "Sora ExtraBold", sans-serif; line-height: 1.12; letter-spacing: -0.01em; width: 100%;
            text-shadow: 0 2px 18px rgba(10, 10, 18, .85); overflow-wrap: break-word; }
  #titulo em { font-style: normal; }
</style>
<div id="capa"><img id="fundo" alt=""><div id="faixa"></div><div id="zona"><div id="titulo"></div></div></div>
<script>
// cfg: {largura, altura, fundo (data URI), titulo (com *destaque*), y0, y1, margem_x, cores: {texto, destaque, escuro}}
function esc(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
async function montar(cfg) {
  const capa = document.getElementById("capa");
  capa.style.width = cfg.largura + "px";
  capa.style.height = cfg.altura + "px";
  document.getElementById("fundo").src = cfg.fundo;
  const zona = document.getElementById("zona");
  const alto = cfg.y1 - cfg.y0;
  Object.assign(zona.style, {left: cfg.margem_x + "px", width: (cfg.largura - 2 * cfg.margem_x) + "px",
                             top: cfg.y0 + "px", height: alto + "px"});
  const faixa = document.getElementById("faixa");
  Object.assign(faixa.style, {top: (cfg.y0 - 80) + "px", height: (alto + 160) + "px",
    background: `linear-gradient(to bottom, transparent, ${cfg.cores.escuro}d0 22%, ${cfg.cores.escuro}d0 78%, transparent)`});
  const t = document.getElementById("titulo");
  t.style.color = cfg.cores.texto;
  t.innerHTML = esc(cfg.titulo).replace(/\*([^*]+)\*/g, (_, p) => `<em style="color:${cfg.cores.destaque}">${p}</em>`);
  await document.fonts.ready;
  document.getElementById("fundo").decode && await document.getElementById("fundo").decode();
  let tam = 170;
  for (; tam > 48; tam -= 4) {
    t.style.fontSize = tam + "px";
    if (t.scrollHeight <= alto && t.scrollWidth <= t.clientWidth + 1) break;
  }
  return {tamanho: tam, cabe: t.scrollHeight <= alto};
}
</script>
</html>
