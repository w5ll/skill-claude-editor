<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>welldit</title>
<style>
  @font-face { font-family: "FontePerfil"; src: url("/fonte.ttf"); font-display: swap; }
  :root {
    --fundo: #16161f; --fundo-profundo: #0a0a12; --cartao: #1a1a24; --linha: #333446;
    --destaque: #a8b4d4; --texto: #eaefef; --apoio: #b4bccd; --rotulo: #8f97ab; --metal: #7f8caa;
    --ok: #8fd4a8; --falha: #f0a3a3; --aviso: #f0d08f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fundo-profundo); color: var(--texto);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .topo { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--fundo-profundo) 92%, transparent); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--linha); }
  .topo .dentro, main { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
  .topo .dentro { display: flex; align-items: center; gap: 12px; height: 60px; }
  h1, h2, .titulo { font-family: "FontePerfil", sans-serif; letter-spacing: -.01em; }
  h1 { font-size: 18px; margin: 0; }
  h1 span { color: var(--destaque); }
  .rodape { max-width: 1080px; margin: 0 auto; padding: 0 16px 28px; font-size: 12px; color: var(--rotulo); }
  .rodape:empty { display: none; }
  .conexao { margin-left: auto; font-size: 13px; color: var(--rotulo); display: flex; align-items: center; gap: 6px; }
  .bolinha { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .bolinha.fora { background: var(--falha); }
  main { padding-top: 24px; padding-bottom: 64px; }
  h2 { font-size: 16px; margin: 32px 0 12px; color: var(--apoio); }
  .cartao { background: var(--cartao); border: 1px solid var(--linha); border-radius: 14px; padding: 16px; }
  .soltar { display: block; border: 2px dashed var(--linha); border-radius: 14px; padding: 28px 16px; text-align: center;
    cursor: pointer; transition: border-color .15s, background .15s; }
  .soltar:hover, .soltar.em-cima { border-color: var(--destaque); background: rgba(168,180,212,.06); }
  .soltar strong { font-family: "FontePerfil", sans-serif; font-size: 17px; display: block; margin-bottom: 4px; }
  .soltar small { color: var(--rotulo); }
  .fila { margin-top: 12px; display: grid; gap: 8px; }
  .envio { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14px; }
  .envio .nome { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .envio .num { color: var(--rotulo); font-variant-numeric: tabular-nums; }
  .barra { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--linha); overflow: hidden; }
  .barra i { display: block; height: 100%; width: 0; background: var(--destaque); transition: width .3s; }
  .barra.ok i { background: var(--ok); }
  .barra.falha i { background: var(--falha); }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .bruto { display: flex; gap: 12px; align-items: center; padding: 10px; }
  .bruto img, .bruto .sem { width: 54px; height: 72px; object-fit: cover; border-radius: 8px; background: var(--linha); flex: none; }
  .bruto .info { min-width: 0; flex: 1; }
  .bruto .info b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .bruto .info span { color: var(--rotulo); font-size: 13px; }
  button { font: inherit; color: var(--texto); background: transparent; border: 1px solid var(--linha);
    border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  button:hover { border-color: var(--destaque); color: var(--destaque); }
  button.mini { font-size: 12px; padding: 3px 8px; margin-top: 4px; }
  .vazio { color: var(--rotulo); font-size: 14px; }
  .trabalho { margin-bottom: 14px; }
  .trabalho .cab { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; }
  .trabalho .cab .titulo { font-size: 17px; }
  .trabalho .cab .quando { color: var(--rotulo); font-size: 13px; }
  .etapas { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 4px; }
  .etapa { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--linha); color: var(--rotulo); }
  .etapa.feito { color: var(--texto); border-color: rgba(143,212,168,.45); background: rgba(143,212,168,.08); }
  .etapa.feito::before { content: "✓ "; color: var(--ok); }
  .etapa.falha { border-color: rgba(240,163,163,.5); color: var(--falha); }
  .etapa small { color: var(--rotulo); margin-left: 4px; }
  .extras { font-size: 13px; color: var(--rotulo); margin-top: 6px; }
  .agora { margin-top: 12px; padding: 12px; border-radius: 10px; background: var(--fundo); border: 1px solid var(--linha); }
  .agora .linha1 { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .agora .linha1 .pct { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--destaque); }
  .agora .det { color: var(--rotulo); font-size: 13px; margin: 2px 0 8px; }
  .agora.parou { border-color: rgba(240,208,143,.5); }
  .agora.parou .linha1 { color: var(--aviso); }
  .gira { width: 14px; height: 14px; border: 2px solid var(--linha); border-top-color: var(--destaque); border-radius: 50%;
    animation: gira 0.9s linear infinite; flex: none; }
  @keyframes gira { to { transform: rotate(360deg); } }
  .versoes { margin-top: 14px; display: grid; gap: 8px; }
  .versao { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 10px 12px; border-radius: 10px;
    background: var(--fundo); border: 1px solid var(--linha); }
  .versao .nome b { font-weight: 600; }
  .versao .nome span { color: var(--rotulo); font-size: 13px; margin-left: 6px; }
  .versao .acoes { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .selo { font-size: 12px; padding: 2px 8px; border-radius: 999px; margin-left: 6px; }
  .selo.ok { background: rgba(143,212,168,.15); color: var(--ok); }
  .selo.falha { background: rgba(240,163,163,.15); color: var(--falha); }
  .checks { grid-column: 1 / -1; margin: 4px 0 0; padding: 0; list-style: none; font-size: 13px; display: none; }
  .checks.aberto { display: block; }
  .checks li { padding: 2px 0; color: var(--apoio); }
  .checks li.f { color: var(--falha); }
  .checks li b { font-weight: 600; }
  .modal { position: fixed; inset: 0; background: rgba(5,5,10,.88); display: none; align-items: center;
    justify-content: center; z-index: 40; padding: 16px; }
  .modal.aberto { display: flex; }
  .modal .caixa { max-width: min(560px, 100%); max-height: 100%; display: flex; flex-direction: column; gap: 10px; }
  .modal video, .modal img { max-width: 100%; max-height: calc(100vh - 110px); border-radius: 12px; background: #000; }
  .modal .barra-topo { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .modal .barra-topo span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .aviso-copiado { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--cartao);
    border: 1px solid var(--destaque); border-radius: 10px; padding: 10px 16px; font-size: 14px; display: none; z-index: 30; }
  a { color: var(--destaque); }
  button.primario { background: var(--destaque); color: var(--fundo-profundo); border-color: var(--destaque); font-weight: 600; }
  button.primario:hover { color: var(--fundo-profundo); filter: brightness(1.08); }
  button:disabled { opacity: .45; cursor: default; }
  button.perigo:hover { border-color: var(--falha); color: var(--falha); }
  select, input[type=text], input[type=number] { font: inherit; color: var(--texto); background: var(--fundo); border: 1px solid var(--linha);
    border-radius: 8px; padding: 7px 9px; width: 100%; }
  .campos, .rapido .grade2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-top: 12px; }
  .campos label, .rapido label.c { display: block; font-size: 13px; color: var(--rotulo); margin-bottom: 4px; }
  .escolhidos { color: var(--apoio); font-size: 14px; }
  .sel { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--rotulo); margin-top: 6px; cursor: pointer; }
  .portao { margin-top: 14px; padding: 14px; border-radius: 12px; border: 1px solid var(--destaque); background: rgba(168,180,212,.06); }
  .portao h3 { margin: 0 0 6px; font-size: 15px; font-family: "FontePerfil", sans-serif; }
  .portao .linhas { margin: 8px 0; padding-left: 18px; color: var(--apoio); font-size: 14px; }
  .pend { margin: 12px 0; }
  .pend .q { font-weight: 600; margin-bottom: 4px; }
  .opcao { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; cursor: pointer; }
  .opcao small { color: var(--ok); margin-left: 4px; }
  .avisos { color: var(--aviso); font-size: 13px; margin: 8px 0; }
  details.rapido { margin: 10px 0; border: 1px solid var(--linha); border-radius: 10px; padding: 8px 10px; }
  details.rapido summary { cursor: pointer; color: var(--apoio); }
  .marcar { display: flex; align-items: center; gap: 8px; font-size: 14px; padding-top: 22px; }
  .botoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
  .fila-linha { font-size: 13px; color: var(--aviso); margin-top: 10px; display: flex; align-items: center; gap: 8px; }
  .etapa.pulada { opacity: .5; }
  .etapa.rodando { border-color: var(--destaque); color: var(--destaque); }
  .etapa.interrompida, .etapa.desatualizada { border-color: rgba(240,208,143,.5); color: var(--aviso); }
  .etapa.falhou { border-color: rgba(240,163,163,.5); color: var(--falha); }
  .erro-rodada { margin-top: 10px; font-size: 13px; color: var(--falha); }
  .revisao { position: fixed; inset: 0; z-index: 25; background: var(--fundo-profundo); display: none; flex-direction: column; }
  .revisao.aberto { display: flex; }
  .rev-topo { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--linha); background: var(--fundo); }
  .rev-topo b { font-family: "FontePerfil", sans-serif; font-size: 16px; }
  .rev-topo .espaco { flex: 1; }
  .rev-topo input[type=number] { width: 70px; }
  .rev-duracao { font-variant-numeric: tabular-nums; color: var(--apoio); }
  .rev-duracao.passou { color: var(--aviso); }
  .rev-corpo { overflow: auto; padding: 8px 16px 80px; max-width: 980px; width: 100%; margin: 0 auto; box-sizing: border-box; flex: 1; }
  .rev-video { margin: 22px 0 6px; color: var(--apoio); font-size: 14px; font-family: "FontePerfil", sans-serif; }
  .fluxo { line-height: 2.1; font-size: 16px; }
  .un { padding: 2px 3px; border-radius: 6px; cursor: pointer; }
  .un:hover { background: rgba(168,180,212,.12); }
  .un.sai { text-decoration: line-through; color: var(--rotulo); opacity: .7; }
  .un.suspeita { box-shadow: inset 0 -2px 0 var(--aviso); }
  .un.alvo { outline: 2px solid var(--destaque); }
  .un .duv { text-decoration: underline dotted var(--aviso); text-underline-offset: 3px; }
  .un .motivo { font-size: 11px; color: var(--rotulo); margin-left: 4px; text-decoration: none; display: inline-block; }
  button.ouvir, button.emenda { font-size: 10px; padding: 0 5px; margin: 0 2px; border-radius: 5px; line-height: 1.5; vertical-align: baseline;
    opacity: .5; border-color: transparent; }
  .fluxo:hover button.ouvir, .fluxo:hover button.emenda, button.ouvir:focus, button.emenda:focus { opacity: .9; }
  button.ouvir:hover, button.emenda:hover { opacity: 1; border-color: var(--destaque); }
  button.emenda { color: var(--destaque); }
  .susp { border: 1px solid var(--linha); border-radius: 10px; padding: 8px 14px; margin: 12px 0; background: var(--fundo); }
  .susp summary { cursor: pointer; color: var(--aviso); }
  .susp ul { margin: 8px 0 2px; padding: 0; list-style: none; }
  .susp li { margin: 6px 0; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 14px; }
  .susp .onde { color: var(--rotulo); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 96px; }
  .susp .trecho { color: var(--rotulo); }
  .leg-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 10px; }
  .leg-linha { display: grid; grid-template-columns: 92px 1fr; gap: 12px; align-items: start; padding: 10px; border: 1px solid var(--linha); border-radius: 12px; background: var(--fundo); }
  .leg-linha img { width: 92px; border-radius: 8px; background: var(--linha); min-height: 160px; object-fit: cover; cursor: zoom-in; }
  .leg-linha .tempo { color: var(--rotulo); font-size: 12px; font-variant-numeric: tabular-nums; margin-bottom: 4px; }
  .marca { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--linha); color: var(--aviso); margin-left: 6px; }
  .troca { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 14px 0; }
  .troca input { width: 160px; }
  .abas { display: flex; gap: 4px; flex-wrap: wrap; }
  .abas button.ativa { background: var(--linha); color: var(--texto); border-color: var(--destaque); }
  .abas button:disabled { opacity: .45; cursor: default; }
  .claude-chip { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--rotulo); margin-left: 12px; }
  .claude-chip button { font-size: 12px; padding: 3px 9px; }
  .claude-chip button.ligado { color: var(--ok); border-color: var(--ok); }
  .claude-chip select { width: auto; font-size: 12px; padding: 3px 6px; }
  .cl-caixa { border: 1px solid var(--linha); border-left: 3px solid var(--destaque); border-radius: 10px; padding: 10px 14px; margin: 10px 0 14px; background: var(--fundo); font-size: 14px; }
  .cl-caixa:empty { display: none; }
  .cl-topo { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .cl-topo .nota, .cl-uso { color: var(--rotulo); font-size: 12px; }
  .cl-erro { color: var(--falha); margin-top: 6px; }
  .cl-resumo { margin: 8px 0 4px; color: var(--apoio); }
  .cl-itens { list-style: none; padding: 0; margin: 8px 0; }
  .cl-itens li { margin: 6px 0; }
  .cl-itens label { display: flex; gap: 8px; align-items: baseline; cursor: pointer; }
  .cl-itens .acao { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--linha); }
  .cl-itens .acao.tirar { color: var(--falha); } .cl-itens .acao.voltar, .cl-itens .acao.usar, .cl-itens .acao.novo { color: var(--ok); }
  .cl-itens .porque { color: var(--rotulo); font-size: 13px; }
  .cl-avisos { color: var(--aviso); font-size: 12px; margin: 4px 0; }
  .aj-aviso { color: var(--apoio); font-size: 13px; margin: 10px 0; padding: 8px 12px; border-radius: 10px; background: var(--fundo); border: 1px solid var(--linha); }
  .aj-aviso b { color: var(--aviso); font-weight: 600; }
  .aj-linha { display: grid; grid-template-columns: minmax(200px, 440px) 1fr; gap: 14px; padding: 12px; margin: 10px 0; border: 1px solid var(--linha); border-radius: 12px; background: var(--fundo); align-items: start; }
  .aj-linha.sem-previa { grid-template-columns: 1fr; }
  .aj-linha img { width: 100%; border-radius: 8px; background: var(--linha); min-height: 80px; cursor: zoom-in; }
  .aj-linha .nome { font-family: "FontePerfil", sans-serif; font-size: 17px; }
  .aj-linha .nome .tipo { font: 11px -apple-system, sans-serif; margin-left: 8px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--linha); color: var(--destaque); }
  .aj-linha .fala { color: var(--rotulo); font-size: 13px; margin: 2px 0 8px; }
  .aj-campos { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: end; margin: 6px 0; }
  .aj-campos label { display: flex; flex-direction: column; font-size: 12px; color: var(--rotulo); gap: 2px; }
  .aj-campos input[type=number] { width: 84px; }
  .aj-campos input[type=text] { width: 190px; }
  .aj-campos select { max-width: 190px; }
  .aj-campos label.sel { flex-direction: row; align-items: center; gap: 8px; font-size: 14px; color: var(--apoio); }
  .troca select { width: auto; max-width: 220px; }
  .troca input[type=number] { width: 84px; }
  .aj-erro { color: var(--falha); font-size: 13px; margin-top: 6px; }
  .zoom-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-top: 12px; }
  .zoom-bloco { border: 1px solid var(--linha); border-radius: 12px; padding: 10px; background: var(--fundo); }
  .zoom-bloco img { width: 100%; max-width: 150px; border-radius: 8px; background: var(--linha); min-height: 120px; display: block; margin: 6px 0; cursor: zoom-in; }
  .zoom-bloco .tempo { font-variant-numeric: tabular-nums; color: var(--apoio); font-size: 13px; }
  .zoom-bloco .motivo { color: var(--rotulo); font-size: 12px; }
  .musicas { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin: 10px 0; }
  .musica { border: 1px solid var(--linha); border-radius: 12px; padding: 10px 12px; background: var(--fundo); }
  .musica.escolhida { border-color: var(--destaque); }
  .musica .nome { font-family: "FontePerfil", sans-serif; font-size: 15px; }
  .musica small { display: block; color: var(--rotulo); margin: 2px 0 6px; }
  .conf-itens { list-style: none; padding: 0; margin: 10px 0; }
  .conf-itens li { padding: 6px 0; border-bottom: 1px solid var(--linha); font-size: 14px; }
  .conf-itens li.f { color: var(--falha); }
  .correcao { display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; padding: 10px 12px; margin: 8px 0; border: 1px solid var(--linha); border-left: 3px solid var(--aviso); border-radius: 10px; background: var(--fundo); }
  .correcao .texto { flex: 1; min-width: 220px; }
  @media (max-width: 560px) {
    .versao { grid-template-columns: 1fr; }
    .versao .acoes { justify-content: flex-start; }
  }
</style>
</head>
<body>
<div class="topo"><div class="dentro">
  <h1>welldit <span id="marca-nome"></span></h1>
  <div class="claude-chip" id="claude-chip" style="display:none"></div>
  <div class="conexao"><i class="bolinha" id="bolinha"></i><span id="conexao">conectando</span></div>
</div></div>

<main>
  <section>
    <h2>Enviar vídeos brutos</h2>
    <label class="soltar" id="soltar">
      <strong>Arraste os vídeos para cá</strong>
      <small>ou clique para escolher · vão para a pasta material-bruto · o original nunca é sobrescrito</small>
      <input type="file" id="arquivos" multiple accept="video/*,.mov,.mp4,.m4v,.txt,.md,.docx,.pdf" hidden>
    </label>
    <div class="fila" id="fila"></div>
  </section>

  <section>
    <h2>Vídeos brutos</h2>
    <div class="grade" id="brutos"><p class="vazio">Carregando...</p></div>
  </section>

  <section id="nova">
    <h2>Nova edição</h2>
    <div class="cartao">
      <div class="escolhidos" id="escolhidos">Marque os vídeos que formam a edição (nos vídeos brutos acima).</div>
      <div class="campos">
        <div><label for="nova-tema">Nome da edição</label><input type="text" id="nova-tema" maxlength="60" placeholder="ex.: planejamento-semana"></div>
        <div><label for="nova-serie">Série (jeito de editar)</label><select id="nova-serie"></select></div>
        <div><label for="nova-perfil">Perfil de marca</label><select id="nova-perfil"></select></div>
      </div>
      <div class="botoes"><button class="primario" id="nova-comecar" disabled>Começar a edição</button></div>
    </div>
  </section>

  <section>
    <h2>Edições</h2>
    <div id="trabalhos"><p class="vazio">Carregando...</p></div>
  </section>
</main>
<footer class="rodape" id="rodape"></footer>

<div class="modal" id="modal">
  <div class="caixa">
    <div class="barra-topo"><span id="modal-nome"></span><button id="fechar">Fechar</button></div>
    <div id="modal-corpo"></div>
  </div>
</div>
<div class="revisao" id="revisao">
  <div class="rev-topo">
    <b id="rev-titulo"></b>
    <span class="rev-duracao" id="rev-duracao"></span>
    <span class="espaco"></span>
    <label class="sel" id="rev-meta-caixa" style="margin:0">meta (s) <input type="number" id="rev-meta" min="10" max="600" placeholder="--"></label>
    <label class="sel" id="rev-so-caixa" style="margin:0"><input type="checkbox" id="rev-so"> só suspeitas</label>
    <button id="rev-desfazer">Desfazer</button>
    <button class="primario" id="rev-aprovar" style="display:none">Aprovar e seguir</button>
    <button id="rev-fechar">Fechar</button>
  </div>
  <div class="rev-corpo" id="rev-corpo"></div>
  <audio id="rev-audio" preload="none"></audio>
</div>
<div class="revisao" id="ajustes">
  <div class="rev-topo">
    <b id="aj-titulo"></b>
    <nav class="abas" id="aj-abas"></nav>
    <span class="espaco"></span>
    <button id="aj-desfazer">Desfazer</button>

</div>
<div class="aviso-copiado" id="copiado">Pedido copiado. Cole no Claude Code.</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const url = (c) => "/arquivo?c=" + encodeURIComponent(c);

function tamanho(b) {
  if (b >= 1e9) return (b / 1e9).toFixed(2).replace(".", ",") + " GB";
  if (b >= 1e6) return Math.round(b / 1e6) + " MB";
  return Math.max(1, Math.round(b / 1e3)) + " KB";
}
function quando(seg) {
  const d = new Date(seg * 1000), hoje = new Date();
  const hora = d.toLocaleTimeString("pt-BR", {hour: "2-digit", minute: "2-digit"});
  if (d.toDateString() === hoje.toDateString()) return "hoje, " + hora;
  return d.toLocaleDateString("pt-BR", {day: "2-digit", month: "2-digit"}) + ", " + hora;
}

function pedidoPara(caminho) {
  return `Edita o vídeo ${caminho} para o Instagram, seguindo a skill em skill/welldit/SKILL.md. ` +
    `Use o ambiente .venv do projeto (source .venv/bin/activate). Antes de tudo, confere se está instalado o que a skill ` +
    `precisa; se faltar algo, me explica e espera meu ok. Depois inspeciona o vídeo e me mostra o cartão de ajustes antes de editar.`;
}
function aviso(txt) { const a = $("#copiado"); a.textContent = txt; a.style.display = "block"; setTimeout(() => a.style.display = "none", 3200); }
async function copiar(texto) {
  try { await navigator.clipboard.writeText(texto); }
  catch {
    const t = document.createElement("textarea"); t.value = texto; document.body.appendChild(t);
    t.select(); document.execCommand("copy"); t.remove();
  }
  aviso("Pedido copiado. Cole no Claude Code.");
}
/* Tudo que muda algo passa por aqui: o cabeçalho X-Painel e o cookie de sessão acompanham o pedido. */
async function api(rota, corpo) {
  const r = await fetch(rota, {method: "POST", headers: {"Content-Type": "application/json", "X-Painel": "1"}, body: JSON.stringify(corpo || {})});
  let d = {};
  try { d = await r.json(); } catch {}
  if (r.status === 401) { location.reload(); throw new Error("sem sessão"); }
  if (!r.ok) throw new Error(d.erro || "o painel recusou o pedido");
  return d;
}
async function agir(rota, corpo, ok) {
  try { const d = await api(rota, corpo); if (ok) aviso(ok); atualizar(); return d; }
  catch (e) { aviso(e.message); }
}

/* ---------- envio ---------- */
const fila = [];
let enviando = false;
const soltar = $("#soltar");
["dragenter", "dragover"].forEach((e) => soltar.addEventListener(e, (ev) => { ev.preventDefault(); soltar.classList.add("em-cima"); }));
["dragleave", "drop"].forEach((e) => soltar.addEventListener(e, (ev) => { ev.preventDefault(); soltar.classList.remove("em-cima"); }));
soltar.addEventListener("drop", (ev) => adicionar(ev.dataTransfer.files));
$("#arquivos").addEventListener("change", (ev) => { adicionar(ev.target.files); ev.target.value = ""; });

function adicionar(lista) {
  for (const f of lista) {
    const el = document.createElement("div");
    el.className = "envio";
    el.innerHTML = `<span class="nome">${esc(f.name)}</span><span class="num">na fila · ${tamanho(f.size)}</span><div class="barra"><i></i></div>`;
    $("#fila").prepend(el);
    fila.push({arquivo: f, el});
  }
  proximo();
}
function proximo() {
  if (enviando || !fila.length) return;
  enviando = true;
  const {arquivo, el} = fila.shift();
  const num = el.querySelector(".num"), barra = el.querySelector(".barra"), i = el.querySelector("i");
  const xhr = new XMLHttpRequest();
  const inicio = Date.now();
  xhr.open("PUT", "/api/enviar?nome=" + encodeURIComponent(arquivo.name));
  xhr.setRequestHeader("X-Painel", "1");
  xhr.upload.onprogress = (ev) => {
    if (!ev.lengthComputable) return;
    const p = ev.loaded / ev.total, s = (Date.now() - inicio) / 1000;
    i.style.width = (p * 100).toFixed(1) + "%";
    const vel = s > 1 ? ` · ${Math.round(ev.loaded / s / 1e6)} MB/s` : "";
    num.textContent = `${Math.round(p * 100)}% de ${tamanho(ev.total)}${vel}`;
  };
  xhr.onload = () => {
    let r = {};
    try { r = JSON.parse(xhr.responseText); } catch {}
    if (xhr.status === 200 && r.ok) {
      barra.classList.add("ok"); i.style.width = "100%";
      num.innerHTML = `enviado como ${esc(r.nome)} `;
      const b = document.createElement("button"); b.className = "mini"; b.textContent = "copiar pedido de edição";
      b.onclick = () => copiar(pedidoPara(r.caminho)); num.appendChild(b);
      atualizar();
    } else {
      barra.classList.add("falha"); num.textContent = r.erro || "falhou";
    }
    enviando = false; proximo();
  };
  xhr.onerror = () => { barra.classList.add("falha"); num.textContent = "o painel não respondeu"; enviando = false; proximo(); };
  xhr.send(arquivo);
}

/* ---------- estado ---------- */
let ultimoBrutos = "", ultimos = {};
const selecionados = new Set();

function desenharBrutos(estado) {
  const chave = JSON.stringify([estado.brutos, estado.enviando]);
  if (chave === ultimoBrutos) return;
  ultimoBrutos = chave;
  const lista = estado.brutos;
  if (!lista.length) { $("#brutos").innerHTML = `<p class="vazio">Nenhum vídeo em material-bruto ainda.</p>`; return; }
  $("#brutos").innerHTML = lista.map((b) => `
    <div class="cartao bruto">
      ${b.video ? `<img loading="lazy" src="/miniatura?c=${encodeURIComponent(b.caminho)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'sem'}))">` : `<div class="sem"></div>`}
      <div class="info"><b title="${esc(b.nome)}">${esc(b.nome)}</b>
        <span>${tamanho(b.tamanho)} · ${quando(b.modificado)}</span><br>
        ${b.video ? `<label class="sel"><input type="checkbox" data-usar="${esc(b.nome)}" ${selecionados.has(b.nome) ? "checked" : ""}> usar numa edição</label>` : ""}
        ${b.video ? `<button class="mini" data-copiar="${esc(b.caminho)}">copiar pedido de edição</button>` : ""}
      </div>
    </div>`).join("");
}

/* ---------- revisão de cortes e legenda ---------- */
const rev = {tipo: null, pasta: null, dados: null, ocupado: false};
let ultimoEstado = null;
const tempoCurto = (s) => { s = Math.max(0, Math.round(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const hashTexto = (t) => { let h = 0; for (const c of t) h = (h * 31 + c.charCodeAt(0)) | 0; return (h >>> 0).toString(36); };
async function pegar(rota) {
  const r = await fetch(rota, {cache: "no-store"});
  let d = {};
  try { d = await r.json(); } catch {}
  if (r.status === 401) { location.reload(); throw new Error("sem sessão"); }
  if (!r.ok) throw new Error(d.erro || "o painel recusou o pedido");
  return d;
}
function tocar(pedacos) {
  const a = $("#rev-audio");
  a.src = "/api/ouvir?pasta=" + encodeURIComponent(rev.pasta) + pedacos.map((p) => `&p=${p.video}:${p.inicio.toFixed(3)}:${p.fim.toFixed(3)}`).join("");
  a.play().catch(() => aviso("Não consegui tocar esse trecho."));
}
function portaoAbertoDa(tipo) {
  const t = ultimoEstado && ultimoEstado.trabalhos.find((x) => x.nome === rev.pasta);
  return !!(t && t.orq && t.orq.portao && t.orq.portao.nome === tipo && t.orq.posicao === null);
}
async function abrirRevisao(tipo, pasta) {
  rev.tipo = tipo; rev.pasta = pasta; rev.dados = null;
  $("#revisao").classList.add("aberto");
  $("#rev-titulo").textContent = (tipo === "cortes" ? "Revisão dos cortes" : "Revisão da legenda") + " · " + pasta;
  $("#rev-meta-caixa").style.display = $("#rev-so-caixa").style.display = tipo === "cortes" ? "" : "none";
  $("#rev-corpo").innerHTML = `<p class="vazio">Carregando...</p>`;
  cl.pasta = null;
  try { rev.dados = await pegar(`/api/${tipo}?pasta=${encodeURIComponent(pasta)}`); desenharRevisao(); tickClaude(); }
  catch (e) { aviso(e.message); fecharRevisao(); }
}
function fecharRevisao() { $("#revisao").classList.remove("aberto"); $("#rev-audio").pause(); rev.tipo = null; atualizar(); }
function desenharRevisao() {
  if (!rev.dados) return;
  const corpo = $("#rev-corpo"), rolagem = corpo.scrollTop;
  $("#rev-aprovar").style.display = portaoAbertoDa(rev.tipo) ? "" : "none";
  $("#rev-aprovar").textContent = rev.tipo === "cortes" ? "Aprovar os cortes e seguir" : "Aprovar a legenda e seguir";
  const n = rev.dados.desfazer;
  $("#rev-desfazer").disabled = !n;
  $("#rev-desfazer").textContent = n ? `Desfazer (${n})` : "Desfazer";
  if (rev.tipo === "cortes") desenharCortes(corpo); else desenharLegenda(corpo);
  corpo.scrollTop = rolagem;
  desenharClaude();
}
function desenharCortes(corpo) {
  const d = rev.dados, dur = d.duracao_final, meta = d.meta;
  $("#rev-duracao").textContent = `Duração: ${tempoCurto(dur)}` + (d.duracao_original ? ` (de ${tempoCurto(d.duracao_original)})` : "") +
    (meta ? ` · meta ${tempoCurto(meta)}: ${dur > meta ? "passa " + tempoCurto(dur - meta) : "cabe, sobram " + tempoCurto(meta - dur)}` : "");
  $("#rev-duracao").classList.toggle("passou", !!meta && dur > meta);
  if (document.activeElement !== $("#rev-meta")) $("#rev-meta").value = meta || "";
  const soSusp = $("#rev-so").checked;
  const comSusp = new Set(d.suspeitas.map((s) => s.unidade).filter(Boolean));
  const emendas = {};
  d.emendas.forEach((e, k) => { (emendas[e.depois_de] = emendas[e.depois_de] || []).push(k); });
  const unidade = (u) => {
    const palavras = u.palavras.map((w) => w.conf < 0.45 ? `<span class="duv" title="palavra duvidosa">${esc(w.p)}</span>` : esc(w.p)).join(" ");
    return `<button class="ouvir" data-ouvir-un="${esc(u.id)}" title="ouvir">▶</button>` +
      `<span class="un ${u.fica ? "fica" : "sai"} ${comSusp.has(u.id) ? "suspeita" : ""}" id="u-${esc(u.id)}" data-un="${esc(u.id)}" title="${u.fica ? "clique para tirar" : "clique para voltar"}">` +
      `${palavras}${!u.fica && u.motivo ? `<span class="motivo">(${esc(u.motivo.slice(0, 38))})</span>` : ""}</span> ` +
      (emendas[u.id] || []).map((k) => `<button class="emenda" data-emenda="${k}" title="emenda ${d.emendas[k].numero}: ouvir como fica a junção">✂</button>`).join("");
  };
  const lista = d.suspeitas.length ? `<details class="susp" ${d.suspeitas.length <= 8 ? "open" : ""}><summary>${d.suspeitas.length} ponto(s) para olhar</summary><ul>` +
    d.suspeitas.map((s, k) => `<li><span class="onde">${esc(s.onde || "")}</span><span>${esc(s.motivo)}${s.texto ? ` <span class="trecho">— ${esc(s.texto)}</span>` : ""}</span>
      ${s.unidade ? `<button class="mini" data-ir="${esc(s.unidade)}">ir</button>` : ""}
      <button class="mini" data-ouvir-sus="${k}">▶ ouvir</button></li>`).join("") + `</ul></details>` : "";
  const videos = d.videos.map((v) => {
    const us = d.unidades.filter((u) => u.video === v.id && (!soSusp || comSusp.has(u.id)));
    return `<div class="rev-video">${esc(v.nome)}${v.duracao ? " · " + tempoCurto(v.duracao) : ""}</div>
      <div class="fluxo">${us.length ? us.map(unidade).join("") : `<span class="vazio">${soSusp ? "Nenhum ponto para olhar neste vídeo." : "Sem fala transcrita."}</span>`}</div>`;
  }).join("");
  corpo.innerHTML = `<div class="cl-caixa" data-cl-tarefa="cortes"></div><p class="extras">Clique numa frase para <b>tirar</b> ou <b>voltar</b>. Frase riscada sai do vídeo. ▶ toca o trecho; ✂ toca a junção entre dois trechos, como o espectador vai ouvir.</p>${lista}${videos}`;
}
function desenharLegenda(corpo) {
  const d = rev.dados;
  $("#rev-duracao").textContent = `${d.blocos.length} blocos de legenda`;
  $("#rev-duracao").classList.remove("passou");
  const linha = (b) => `<div class="leg-linha" data-bloco="${b.indice}">
      <img loading="lazy" alt="prévia" title="clique para ampliar" src="/api/legenda/previa?pasta=${encodeURIComponent(rev.pasta)}&i=${b.indice}&v=${hashTexto(b.texto)}">
      <div><div class="tempo">${tempoCurto(b.inicio)} · bloco ${b.indice + 1}</div>
        <input type="text" maxlength="80" value="${esc(b.texto)}" data-orig="${esc(b.texto)}" data-texto="${b.indice}">
        <div class="extras">${b.destaque ? "" : `<span class="marca">sem destaque da palavra</span>`}${b.marcas.map((m) => `<span class="marca">${esc(m)}</span>`).join("")}</div></div></div>`;
  corpo.innerHTML = `<div class="cl-caixa" data-cl-tarefa="grafia"></div><p class="extras">Corrija o texto de qualquer bloco e saia do campo (ou Enter): a prévia mostra o quadro com a legenda no lugar em que ela vai ficar.</p>
    <div class="troca"><span>Corrigir em todos:</span><input type="text" id="troca-de" placeholder="palavra errada" maxlength="40">
      <span>→</span><input type="text" id="troca-para" placeholder="palavra certa" maxlength="40"><button id="troca-ir">Trocar</button></div><div class="leg-grade">${d.blocos.map(linha).join("")}</div>`;
}
async function agirRev(rota, corpo, ok) {
  if (rev.ocupado) return null;
  rev.ocupado = true;
  try { const d = await api(rota, {pasta: rev.pasta, ...corpo}); if (d.painel) rev.dados = d.painel; if (ok) aviso(ok(d)); return d; }
  catch (e) { aviso(e.message); return null; }
  finally { rev.ocupado = false; }
}
function alvoDeUnidade(id) { return rev.dados.unidades.find((u) => u.id === id); }
document.addEventListener("click", async (ev) => {
  const el = ev.target;
  if (!$("#revisao").classList.contains("aberto")) return;
  const b = el.closest("button");
  if (b && b.dataset.ouvirUn) { const u = alvoDeUnidade(b.dataset.ouvirUn); tocar([{video: u.video, inicio: Math.max(0, u.inicio - 0.2), fim: u.fim + 0.2}]); return; }
  if (b && b.dataset.ouvirSus) { const s = rev.dados.suspeitas[+b.dataset.ouvirSus]; tocar([{video: s.video, inicio: Math.max(0, s.tempo - 2), fim: s.tempo + 2}]); return; }
  if (b && b.dataset.emenda) { tocar(rev.dados.emendas[+b.dataset.emenda].pedacos); return; }
  if (b && b.dataset.ir) { const alvo = document.getElementById("u-" + b.dataset.ir); if (alvo) { alvo.scrollIntoView({block: "center"}); alvo.classList.add("alvo"); setTimeout(() => alvo.classList.remove("alvo"), 1800); } return; }
  if (el.tagName === "IMG" && el.closest(".leg-linha")) { abrir("Prévia da legenda", `<img src="${el.src}" alt="">`); return; }
  const un = el.closest(".un");
  if (un && rev.tipo === "cortes") {
    const u = alvoDeUnidade(un.dataset.un);
    const r = await agirRev("/api/cortes/alternar", {video: u.video, k0: u.k0, k1: u.k1, acao: u.fica ? "tirar" : "voltar"});
    if (r) desenharRevisao();
    return;
  }
  if (el.id === "troca-ir") {
    const de = $("#troca-de").value.trim(), para = $("#troca-para").value.trim();
    const r = await agirRev("/api/legenda/substituir", {de, para}, (d) => d.mudou ? `${d.mudou} bloco(s) corrigido(s).` : "Não achei essa palavra nas legendas.");
    if (r) desenharRevisao();
  }
});
$("#rev-so").addEventListener("change", desenharRevisao);
$("#rev-fechar").onclick = fecharRevisao;
$("#rev-desfazer").onclick = async () => {
  const r = await agirRev(rev.tipo === "cortes" ? "/api/cortes/desfazer" : "/api/legenda/desfazer", {}, () => "Desfeito.");
  if (r) desenharRevisao();
};
$("#rev-aprovar").onclick = async () => {
  const pasta = rev.pasta, tipo = rev.tipo;
  try { await api("/api/aprovar", {pasta, portao: tipo, seguir: true}); aviso("Aprovado. Seguindo."); fecharRevisao(); }
  catch (e) { aviso(e.message); }
};
$("#rev-meta").addEventListener("change", async () => {
  const v = $("#rev-meta").value;
  const r = await agirRev("/api/ajustar", {chave: "meta_duracao", valor: v ? parseInt(v, 10) : null}, () => "Meta guardada.");
  if (r) { rev.dados = await pegar(`/api/cortes?pasta=${encodeURIComponent(rev.pasta)}`); desenharRevisao(); }
});
document.addEventListener("change", async (ev) => {
  const campo = ev.target.closest("input[data-texto]");
  if (!campo || rev.tipo !== "legenda" || campo.value === campo.dataset.orig) return;
  const i = +campo.dataset.texto;
  const r = await agirRev("/api/legenda/editar", {indice: i, texto: campo.value}, () => "Legenda atualizada.");
  if (r) {
    const b = rev.dados.blocos[i];
    campo.value = b.texto; campo.dataset.orig = b.texto;
    const linha = campo.closest(".leg-linha");
    linha.querySelector("img").src = `/api/legenda/previa?pasta=${encodeURIComponent(rev.pasta)}&i=${i}&v=${hashTexto(b.texto)}`;
    linha.querySelector(".extras").innerHTML = (b.destaque ? "" : `<span class="marca">sem destaque da palavra</span>`) + b.marcas.map((m) => `<span class="marca">${esc(m)}</span>`).join("");
    $("#rev-desfazer").disabled = !rev.dados.desfazer; $("#rev-desfazer").textContent = rev.dados.desfazer ? `Desfazer (${rev.dados.desfazer})` : "Desfazer";
  } else { campo.value = campo.dataset.orig; }
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && ev.target.matches && ev.target.matches("input[data-texto]")) ev.target.blur();
  if (ev.key === "Escape" && $("#revisao").classList.contains("aberto")) fecharRevisao();
});

/* ---------- ajustes: elementos, zoom, som e conferência (Fase 7) ---------- */
const aj = {pasta: null, aba: null, dados: {}, erros: {}, ocupado: false};
const ABAS = [["elementos", "Elementos"], ["zoom", "Zoom"], ["som", "Som"], ["conferencia", "Conferência"]];
const PORTAO_DA_ABA = {elementos: "elementos", conferencia: "problemas"};
const tempoFino = (s) => { s = Math.max(0, s); const m = Math.floor(s / 60); return `${m}:${(s - m * 60).toFixed(1).padStart(4, "0").replace(".", ",")}`; };
const num = (n) => String(n).replace(".", ",");
const qs = () => encodeURIComponent(aj.pasta);

function trabalhoAj() { return ultimoEstado && ultimoEstado.trabalhos.find((x) => x.nome === aj.pasta); }
function portaoAbertoEm(nome) {
  const t = trabalhoAj();
  return !!(t && t.orq && t.orq.portao && t.orq.portao.nome === nome && t.orq.posicao === null);
}
function botoesDoAjuste() {
  const nome = PORTAO_DA_ABA[aj.aba], b = $("#aj-aprovar");
  b.style.display = nome && portaoAbertoEm(nome) ? "" : "none";
  b.textContent = aj.aba === "elementos" ? "Aprovar os elementos e seguir" : "Aceitar assim mesmo e seguir";
  const n = (aj.dados[aj.aba] || {}).desfazer || 0;
  $("#aj-desfazer").style.display = aj.aba === "conferencia" ? "none" : "";
  $("#aj-desfazer").disabled = !n;
  $("#aj-desfazer").textContent = n ? `Desfazer (${n})` : "Desfazer";
}
async function abrirAjustes(aba, pasta) {
  aj.pasta = pasta; aj.dados = {}; aj.erros = {}; cl.pasta = null;
  $("#ajustes").classList.add("aberto");
  $("#aj-titulo").textContent = "Ajustes · " + pasta;
  await trocarAba(aba);
}
function fecharAjustes() { $("#ajustes").classList.remove("aberto"); $("#aj-audio").pause(); aj.aba = null; atualizar(); }
async function trocarAba(aba) {
  aj.aba = aba;
  $("#aj-corpo").innerHTML = `<p class="vazio">Carregando...</p>`;
  desenharAbas();
  try { aj.dados[aba] = await pegar(`/api/${aba}?pasta=${qs()}`); aj.erros[aba] = null; }
  catch (e) { aj.dados[aba] = null; aj.erros[aba] = e.message; }
  if (aj.aba === aba) { desenharAjustes(); tickClaude(); }
}
function desenharAbas() {
  $("#aj-abas").innerHTML = ABAS.map(([k, nome]) => `<button data-aba="${k}" class="${aj.aba === k ? "ativa" : ""}">${nome}</button>`).join("");
}
function desenharAjustes() {
  const corpo = $("#aj-corpo"), rolagem = corpo.scrollTop;
  desenharAbas(); botoesDoAjuste();
  const d = aj.dados[aj.aba];
  if (!d) corpo.innerHTML = `<p class="vazio">${esc(aj.erros[aj.aba] || "Sem dados.")}</p>`;
  else corpo.innerHTML = {elementos: htmlElementos, zoom: htmlZoom, som: htmlSom, conferencia: htmlConferencia}[aj.aba](d);
  corpo.scrollTop = rolagem;
  desenharClaude();
}
async function agirAj(rota, corpo, ok) {
  if (aj.ocupado) return null;
  aj.ocupado = true;
  const aba = aj.aba;
  try {
    const d = await api(rota, {pasta: aj.pasta, ...corpo});
    if (d.painel) aj.dados[aba] = d.painel;
    if (ok) aviso(ok(d));
    return d;
  } catch (e) { aviso(e.message); return null; }
  finally { aj.ocupado = false; }
}
const AVISO_REPLANEJA = `Ao salvar, o <b>zoom</b> e os <b>efeitos de som</b> são planejados de novo quando a edição continua. Por isso, acerte os elementos primeiro, depois o zoom, depois o som.`;

/* ---- elementos ---- */
function htmlElementos(d) {
  const opcoes = (atual) => d.prontos.map((n) => `<option value="${esc(n)}" ${n === atual ? "selected" : ""}>${esc(n)}</option>`).join("") +
    d.catalogo.map((c) => `<option value="gerado:${esc(c.nome)}" ${"gerado:" + c.nome === atual ? "selected" : ""}>${esc(c.nome)} (catálogo)</option>`).join("");
  const posicoes = (atual) => d.posicoes.map((x) => `<option ${x === atual ? "selected" : ""}>${x}</option>`).join("");
  const linha = (i) => {
    const max = i.modo === "tela" ? d.duracao_tela[1] : d.duracao[1];
    const tipo = {gerado: "desenhado na hora", cena: "cena", imagem: "imagem de apoio", pronto: ""}[i.tipo];
    const campos = i.editavel ? `
      <div class="aj-campos">
        <label>Entra em (s)<input type="number" step="0.1" min="0" value="${i.inicio}" data-el="tempo" data-id="${esc(i.id)}" data-campo="inicio"></label>
        <label>Dura (s)<input type="number" step="0.1" min="${d.duracao[0]}" max="${max}" value="${i.duracao}" data-el="tempo" data-id="${esc(i.id)}" data-campo="duracao"></label>
        <label>Rótulo<input type="text" maxlength="${d.max_rotulo}" value="${esc(i.texto)}" data-el="rotulo" data-id="${esc(i.id)}" placeholder="sem rótulo"></label>
      </div>
      <div class="aj-campos">
        <label>Modo<select data-el="modo" data-id="${esc(i.id)}"><option value="sobreposto" ${i.modo === "sobreposto" ? "selected" : ""}>sobreposto</option><option value="tela" ${i.modo === "tela" ? "selected" : ""}>tela cheia</option></select></label>
        <label>Posição<select data-el="posicao" data-id="${esc(i.id)}" ${i.modo === "tela" ? "disabled" : ""}>${posicoes(i.posicao)}</select></label>
        <label>Trocar por<select data-el="trocar" data-id="${esc(i.id)}"><option value="">escolha...</option>${opcoes(i.elemento)}</select></label>
      </div>` : `
      <div class="aj-campos"><label>Entra em (s)<input type="number" step="0.1" min="0" value="${i.inicio}" data-el="tempo" data-id="${esc(i.id)}" data-campo="inicio"></label>
        <label>Dura (s)<input type="number" step="0.1" value="${i.duracao}" data-el="tempo" data-id="${esc(i.id)}" data-campo="duracao"></label></div>
      <div class="extras">O texto desta ${esc(tipo)} vem da fala: dá para mudar o momento ou tirar.</div>`;
    return `<div class="aj-linha ${i.previa ? "" : "sem-previa"}" data-linha="${esc(i.id)}">
      ${i.previa ? `<img loading="lazy" alt="prévia" title="clique para ampliar" src="/api/elementos/previa?pasta=${qs()}&id=${encodeURIComponent(i.id)}&v=${hashTexto(JSON.stringify([i.elemento, i.modo, i.posicao, i.texto, i.duracao]))}">` : ""}
      <div><div class="nome">${esc(i.nome)}${tipo ? `<span class="tipo">${esc(tipo)}</span>` : ""}</div>
        <div class="fala">no vídeo em ${tempoFino(i.inicio)}${i.gatilho ? ` · chamado por “${esc(i.gatilho)}”` : ""}${i.ideia ? ` · ${esc(i.ideia)}` : ""}</div>
        ${campos}
        ${i.problema ? `<div class="aj-erro">Desenho com problema: ${esc(i.problema)}</div>` : ""}
        <div class="botoes"><button class="perigo" data-aj="tirar" data-id="${esc(i.id)}">Tirar</button>
          ${i.tipo === "gerado" && !i.no_catalogo && !i.problema ? `<button data-aj="promover" data-id="${esc(i.id)}" title="o próximo vídeo já acha este elemento pela palavra">Guardar no catálogo</button>` : ""}
          ${i.no_catalogo ? `<span class="marca">no catálogo</span>` : ""}</div></div></div>`;
  };
  const total = d.duracao_final ? ` O vídeo tem ${tempoFino(d.duracao_final)}.` : "";
  return `<div class="cl-caixa" data-cl-tarefa="elementos"></div><p class="aj-aviso">${AVISO_REPLANEJA}${total}</p>
    <div class="troca"><span>Adicionar:</span><select id="aj-novo-el">${opcoes("")}</select>
      <span>em</span><input type="number" step="0.1" min="0" id="aj-novo-t" value="0" style="width:84px"><span>s</span>
      <select id="aj-novo-modo"><option value="sobreposto">sobreposto</option><option value="tela">tela cheia</option></select>
      <button id="aj-novo-ir" data-aj="adicionar">Adicionar</button></div>
    ${d.itens.length ? d.itens.map(linha).join("") : `<p class="vazio">Nenhum elemento nesta edição. Use Adicionar para pôr um.</p>`}`;
}

/* ---- zoom ---- */
function htmlZoom(d) {
  const inten = ["nenhum", "leve", "normal", "forte"].map((x) => `<option value="${x}" ${x === d.escolha ? "selected" : ""}>${{nenhum: "parado, sem zoom", leve: "leve", normal: "normal", forte: "forte"}[x]}</option>`).join("");
  const topo = `<div class="aj-campos"><label>Intensidade do zoom<select data-aj-escolha="camera">${inten}</select></label>
    <span class="extras">Mudar a intensidade planeja o zoom de novo quando a edição continua.</span>
    <button data-aj="continuar">Continuar a edição agora</button></div>`;
  if (!d.planejado) return `${topo}<p class="vazio">O zoom ainda não foi planejado${d.escolha === "nenhum" ? " (está desligado: escolha uma intensidade)" : ": a edição ainda não chegou nessa etapa"}.</p>`;
  const bloco = (b) => `<div class="zoom-bloco"><div class="tempo">${tempoFino(b.inicio)} a ${tempoFino(b.fim)}</div>
      <div class="motivo">${esc(b.motivo)}</div>
      <img loading="lazy" alt="enquadramento" title="clique para ampliar" src="/api/zoom/previa?pasta=${qs()}&i=${b.indice}&v=${hashTexto(JSON.stringify([b.zoom, b.inicio, b.fim]))}">
      <div class="aj-campos"><label>Nível<select data-aj-zoom="${b.indice}">${["aberto", "perto", "enfase"].map((n) => `<option value="${n}" ${b.nivel === n ? "selected" : ""}>${{aberto: "aberto", perto: "mais perto", enfase: "ênfase"}[n]} (${num(d.niveis[n])}×)</option>`).join("")}${b.nivel === "outro" ? `<option selected>${num(b.zoom)}× (manual)</option>` : ""}</select></label>
      ${b.enfase ? `<button class="mini" data-aj="tirar-enfase" data-i="${b.indice}">Tirar a ênfase</button>` : ""}</div></div>`;
  return `${topo}<p class="aj-aviso">O zoom <b>nunca muda com um elemento 3D na tela</b>: se um ajuste fizer isso, o painel recusa e diz em que momento está o elemento. O quadro mostra o enquadramento do meio do bloco, ancorado no rosto.</p>
    <div class="zoom-grade">${d.blocos.map(bloco).join("")}</div>`;
}

/* ---- som ---- */
function htmlSom(d) {
  const e = d.escolha, lim = d.limites;
  const musica = (m) => `<div class="musica ${e.musica === m.nome ? "escolhida" : ""}"><div class="nome">${esc(m.titulo)}</div>
      <small>${esc(m.descricao)} · ${esc(m.autor)}</small>
      <button class="mini" data-aj="ouvir-musica" data-nome="${esc(m.nome)}">▶ ouvir 30 s</button>
      <button class="mini ${e.musica === m.nome ? "primario" : ""}" data-aj-musica="${esc(m.nome)}">${e.musica === m.nome ? "escolhida" : "usar esta"}</button></div>`;
  const efeito = (x) => `<div class="aj-linha sem-previa"><div><div class="nome">${esc(x.descricao || x.som)}</div>
      <div class="fala">${tempoFino(x.tempo)} · junto do elemento ${esc(x.elemento)}</div>
      <div class="aj-campos"><label>Som<select data-aj-som="${x.indice}">${d.sons.map((s) => `<option value="${esc(s.nome)}" ${s.nome === x.som ? "selected" : ""}>${esc(s.descricao)}</option>`).join("")}</select></label>
        <label>Volume (dB)<input type="number" step="0.5" min="${lim.ganho_efeito[0]}" max="${lim.ganho_efeito[1]}" value="${x.ganho_db}" data-aj-ganho="${x.indice}"></label>
        <button class="mini" data-aj="ouvir-efeito" data-nome="${esc(x.som)}">▶ ouvir</button>
        <button class="mini perigo" data-aj="tirar-efeito" data-i="${x.indice}">Tirar</button></div></div></div>`;
  const niveis = d.musica ? `<div class="aj-campos"><label>Música abaixo da voz (dB)<input type="number" step="1" min="${lim.abaixo[0]}" max="${lim.abaixo[1]}" value="${d.musica.abaixo_da_voz_db}" id="aj-abaixo" data-aj-nivel></label>
      <label>Sobe nas pausas (dB)<input type="number" step="1" min="${lim.sobe[0]}" max="${lim.sobe[1]}" value="${d.musica.sobe_na_pausa_db}" id="aj-sobe" data-aj-nivel></label></div>` : "";
  return `<p class="aj-aviso">Escolher a música ou ligar os efeitos planeja o som de novo quando a edição continua. A mistura final (voz, música e efeitos juntos) se confere na amostra. <button class="mini" data-aj="continuar">Continuar a edição agora</button></p>
    <div class="aj-campos"><label class="sel"><input type="checkbox" data-aj-efeitos ${e.efeitos ? "checked" : ""}> um efeito sonoro em cada elemento 3D</label></div>
    <div class="musicas"><div class="musica ${e.musica === "nenhuma" ? "escolhida" : ""}"><div class="nome">Sem música</div><small>só a voz</small>
      <button class="mini ${e.musica === "nenhuma" ? "primario" : ""}" data-aj-musica="nenhuma">${e.musica === "nenhuma" ? "escolhida" : "usar esta"}</button></div>${d.musicas.map(musica).join("")}</div>
    ${niveis}
    <h2 style="margin-top:22px">Efeitos desta edição</h2>
    ${d.efeitos.length ? d.efeitos.map(efeito).join("") : `<p class="vazio">${d.planejado ? "Nenhum efeito." : "O som ainda não foi planejado."}</p>`}`;
}

/* ---- conferência ---- */
function htmlConferencia(d) {
  const itens = d.checks.map((x) => `<li class="${x.ok ? "" : "f"}">${x.ok ? "✓" : "✗"} <b>${esc(x.item)}</b>: ${esc(x.detalhe)}</li>`).join("");
  const botoes = (c) => ({
    pausa: `<button class="primario" data-aj="aceitar-pausa" data-inicio="${c.inicio}">Aceitar essa pausa</button>`,
    ganho: `<button class="primario" data-aj="aplicar-ganho" data-trecho="${c.trecho}" data-ganho="${c.ganho_db}">Aplicar o ganho sugerido (${c.ganho_db > 0 ? "+" : ""}${num(c.ganho_db)} dB)</button>`,
    cortes: `<button data-aj="abrir-cortes">Abrir a revisão dos cortes</button>`,
  }[c.tipo] || "");
  const correcoes = d.correcoes.map((c) => `<div class="correcao"><span class="texto">${esc(c.texto)}</span>${botoes(c)}</div>`).join("");
  return `<h2 style="margin-top:8px">${esc(d.video)} · ${d.aprovado ? "tudo certo" : "com problema"}</h2>
    <ul class="conf-itens">${itens}</ul>
    ${correcoes ? `<h2>O que dá para consertar com um botão</h2>${correcoes}` : (d.aprovado ? "" : `<p class="vazio">Nenhum destes problemas tem conserto automático: refaça o vídeo ou aceite assim mesmo.</p>`)}
    ${d.pausas_ok.length ? `<p class="extras">Pausas aceitas: ${d.pausas_ok.map((x) => tempoFino(x)).join(", ")}</p>` : ""}
    <div class="botoes" style="margin-top:14px"><button data-aj="refazer-video">Refazer o vídeo (uma versão nova, a anterior fica)</button></div>`;
}

/* ---- eventos ---- */
document.addEventListener("click", async (ev) => {
  if (!$("#ajustes").classList.contains("aberto")) return;
  const el = ev.target;
  if (el.tagName === "IMG" && el.closest(".aj-linha, .zoom-bloco")) { abrir("Prévia", `<img src="${el.src}" alt="">`); return; }
  const aba = el.closest("[data-aba]");
  if (aba && aba.closest("#aj-abas")) { trocarAba(aba.dataset.aba); return; }
  const m = el.closest("[data-aj-musica]");
  if (m) { await escolherAj("som.musica", m.dataset.ajMusica); return; }
  const b = el.closest("button[data-aj]");
  if (!b) return;
  const d = b.dataset;
  switch (d.aj) {
    case "tirar": { const r = await agirAj("/api/elementos/tirar", {id: d.id}, () => "Elemento tirado."); if (r) desenharAjustes(); break; }
    case "adicionar": {
      const r = await agirAj("/api/elementos/adicionar", {elemento: $("#aj-novo-el").value, inicio: parseFloat($("#aj-novo-t").value), modo: $("#aj-novo-modo").value}, () => "Elemento adicionado.");
      if (r) desenharAjustes(); break;
    }
    case "promover": {
      const sugestao = ((aj.dados.elementos.itens.find((i) => i.id === d.id) || {}).gatilho || "").toLowerCase().replace(/[^a-zà-ÿ ]/g, "").split(" ").filter((x) => x.length >= 4).join(", ");
      const resp = window.prompt("Palavras que chamam este elemento nos próximos vídeos (separadas por vírgula, de 3 a 24 letras):", sugestao);
      if (resp === null) break;
      const r = await agirAj("/api/elementos/promover", {id: d.id, palavras: resp.split(",").map((x) => x.trim()).filter(Boolean)}, () => "Guardado no catálogo.");
      if (r) desenharAjustes(); break;
    }
    case "tirar-enfase": { const r = await agirAj("/api/zoom/tirar-enfase", {indice: +d.i}, () => "Ênfase tirada."); if (r) desenharAjustes(); break; }
    case "ouvir-musica": tocarSom("musica", d.nome); break;
    case "ouvir-efeito": tocarSom("efeito", d.nome); break;
    case "tirar-efeito": { const r = await agirAj("/api/som/tirar", {indice: +d.i}, () => "Efeito tirado."); if (r) desenharAjustes(); break; }
    case "continuar": try { await api("/api/iniciar", {pasta: aj.pasta}); aviso("Na fila."); fecharAjustes(); } catch (e) { aviso(e.message); } break;
    case "aceitar-pausa": {
      const r = await agirAj("/api/conferencia/aceitar-pausa", {inicio: parseFloat(d.inicio)}, () => "Pausa aceita. Conferindo de novo.");
      if (r) fecharAjustes(); break;
    }
    case "aplicar-ganho": {
      const r = await agirAj("/api/conferencia/aplicar-ganho", {trecho: +d.trecho, ganho_db: parseFloat(d.ganho)}, () => "Ganho aplicado. Refazendo o vídeo.");
      if (r) fecharAjustes(); break;
    }
    case "abrir-cortes": { const pasta = aj.pasta; fecharAjustes(); abrirRevisao("cortes", pasta); break; }
    case "refazer-video": {
      try { await api("/api/refazer", {pasta: aj.pasta, etapa: "video"}); await api("/api/iniciar", {pasta: aj.pasta}); aviso("Refazendo o vídeo."); fecharAjustes(); }
      catch (e) { aviso(e.message); }
      break;
    }
  }
});
async function escolherAj(chave, valor) {
  const r = await agirAj("/api/ajustar", {chave, valor}, (x) => x.refeitas.length ? "Escolha guardada. Será refeito: " + x.refeitas.join(", ") + "." : "Escolha guardada.");
  if (r) await trocarAba(aj.aba);
}
function tocarSom(tipo, nome) {
  const a = $("#aj-audio");
  a.src = `/api/som/ouvir?pasta=${qs()}&tipo=${tipo}&nome=${encodeURIComponent(nome)}`;
  a.play().catch(() => aviso("Não consegui tocar esse som."));
}
document.addEventListener("change", async (ev) => {
  if (!$("#ajustes").classList.contains("aberto")) return;
  const el = ev.target;
  const d = el.dataset;
  if (d.el === "tempo") {
    const linha = el.closest(".aj-linha");
    const [ini, dur] = ["inicio", "duracao"].map((c) => parseFloat(linha.querySelector(`[data-campo=${c}]`).value));
    const r = await agirAj("/api/elementos/tempo", {id: d.id, inicio: ini, duracao: dur}, () => "Momento atualizado.");
    desenharAjustes(); return;                                      // com erro, redesenha com o que está salvo
  }
  if (d.el === "rotulo") { await agirAj("/api/elementos/rotulo", {id: d.id, texto: el.value}, () => "Rótulo atualizado."); desenharAjustes(); return; }
  if (d.el === "modo" || d.el === "posicao") {
    const linha = el.closest(".aj-linha");
    await agirAj("/api/elementos/modo", {id: d.id, modo: linha.querySelector("[data-el=modo]").value, posicao: linha.querySelector("[data-el=posicao]").value}, () => "Modo atualizado.");
    desenharAjustes(); return;
  }
  if (d.el === "trocar") { if (el.value) await agirAj("/api/elementos/trocar", {id: d.id, elemento: el.value}, () => "Elemento trocado."); desenharAjustes(); return; }
  if (d.ajZoom !== undefined) { await agirAj("/api/zoom/nivel", {indice: +d.ajZoom, nivel: el.value}, () => "Zoom atualizado."); desenharAjustes(); return; }
  if (d.ajEscolha === "camera") { await escolherAj("camera", el.value); return; }
  if (d.ajEfeitos !== undefined) { await escolherAj("som.efeitos", el.checked); return; }
  if (d.ajSom !== undefined) { await agirAj("/api/som/trocar", {indice: +d.ajSom, som: el.value}, () => "Som trocado."); desenharAjustes(); return; }
  if (d.ajGanho !== undefined) { await agirAj("/api/som/ganho", {indice: +d.ajGanho, ganho_db: parseFloat(el.value)}, () => "Volume atualizado."); desenharAjustes(); return; }
  if (d.ajNivel !== undefined) { await agirAj("/api/som/musica", {abaixo: parseFloat($("#aj-abaixo").value), sobe: parseFloat($("#aj-sobe").value)}, () => "Música atualizada."); desenharAjustes(); return; }
});
$("#aj-fechar").onclick = fecharAjustes;
$("#aj-desfazer").onclick = async () => {
  const rota = {elementos: "/api/elementos/desfazer", zoom: "/api/zoom/desfazer", som: "/api/som/desfazer"}[aj.aba];
  if (rota && await agirAj(rota, {}, () => "Desfeito.")) desenharAjustes();
};
$("#aj-aprovar").onclick = async () => {
  const pasta = aj.pasta, portao = PORTAO_DA_ABA[aj.aba];
  try { await api("/api/aprovar", {pasta, portao, seguir: true}); aviso("Aprovado. Seguindo."); fecharAjustes(); }
  catch (e) { aviso(e.message); }
};
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && $("#ajustes").classList.contains("aberto")) fecharAjustes(); });

/* ---------- Claude por trás, opcional (Fase 8) ---------- */
const cl = {dados: null, pasta: null, chave: "", desmarcados: {}};
const claudeLigado = () => !!(ultimoEstado && ultimoEstado.claude && ultimoEstado.claude.ligado);
const pastaAberta = () => rev.tipo ? rev.pasta : aj.aba ? aj.pasta : null;
const MOMENTO = (s) => `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, "0").replace(".", ",")}`;

function desenharChipClaude() {
  const g = ultimoEstado && ultimoEstado.claude, chip = $("#claude-chip");
  if (!g || !g.disponivel) { chip.style.display = "none"; chip.innerHTML = ""; return; }      // sem Claude Code, ou aberto com --sem-claude: nada aparece
  chip.style.display = "";
  const html = `Claude por trás <button data-cl="ligar" class="${g.ligado ? "ligado" : ""}" title="${g.ligado ? "desligar" : "ligar"}">${g.ligado ? "ligado" : "desligado"}</button>` +
    (g.ligado ? `<select data-cl-modelo title="modelo">${g.modelos.map((m) => `<option ${m === g.modelo ? "selected" : ""}>${m}</option>`).join("")}</select>` : "");
  if (chip.dataset.h !== html) { chip.innerHTML = html; chip.dataset.h = html; }
}

function itemDoClaude(tarefa, it) {
  if (tarefa === "cortes") return `<span class="acao ${it.acao}">${it.acao === "tirar" ? "TIRAR" : "VOLTAR"}</span><span>“${esc(it.texto)}”${it.motivo ? ` <span class="porque">· ${esc(it.motivo)}</span>` : ""}</span>`;
  if (tarefa === "grafia") return `<span class="acao usar">bloco ${it.bloco + 1}</span><span>“${esc(it.antes)}” → “${esc(it.depois)}”${it.motivo ? ` <span class="porque">· ${esc(it.motivo)}</span>` : ""}</span>`;
  if (it.tipo === "tirar") return `<span class="acao tirar">TIRAR</span><span>${esc(it.texto)} <span class="porque">(${esc(it.alvo)})${it.motivo ? " · " + esc(it.motivo) : ""}</span></span>`;
  if (it.tipo === "novo") return `<span class="acao novo">DESENHAR</span><span><b>${esc(it.nome)}</b> em ${MOMENTO(it.inicio)} (${it.duracao} s, ${esc(it.animacao)})${it.texto ? ` · rótulo ${esc(it.texto)}` : ""}${it.ideia ? ` <span class="porque">· ${esc(it.ideia)}</span>` : ""} <span class="porque">· o desenho é medido na prévia depois de aplicar</span></span>`;
  return `<span class="acao usar">PÔR</span><span><b>${esc(it.elemento)}</b> em ${MOMENTO(it.inicio)} (${it.duracao} s)${it.texto ? ` · rótulo ${esc(it.texto)}` : ""}${it.ideia ? ` <span class="porque">· ${esc(it.ideia)}</span>` : ""}</span>`;
}

function htmlClaude(tarefa) {
  const d = cl.dados, g = ultimoEstado && ultimoEstado.claude;
  if (!g || !g.ligado || !d) return "";
  const t = d.tarefas.find((x) => x.id === tarefa);
  if (!t) return "";
  const p = t.proposta, pend = p && p.estado === "pendente";
  const desm = cl.desmarcados[tarefa] || new Set();
  let corpo = "";
  if (t.rodando) corpo = `<div class="cl-topo"><i class="gira"></i>O Claude está trabalhando (${t.segundos ?? 0} s)... <button class="mini perigo" data-cl="cancelar">Cancelar</button></div>`;
  else corpo = `<div class="cl-topo"><button class="${pend ? "" : "primario"}" data-cl="pedir" data-tarefa="${tarefa}" ${d.ocupado ? "disabled" : ""}>Pedir ao Claude: ${esc(t.titulo.toLowerCase())}</button>
      <span class="nota">${d.ocupado ? "há outro pedido em andamento" : "gasta do seu plano; nada é aplicado sem você marcar"}</span></div>`;
  if (t.erro) corpo += `<div class="cl-erro">${esc(t.erro)}</div>`;
  if (pend) {
    corpo += `<div class="cl-resumo"><b>Sugestão do Claude</b>${p.resumo ? ": " + esc(p.resumo) : ""}</div>`;
    corpo += p.itens.length ? `<ul class="cl-itens">${p.itens.map((it) => `<li><label><input type="checkbox" data-cl-item="${esc(it.id)}" ${desm.has(it.id) ? "" : "checked"}>${itemDoClaude(tarefa, it)}</label></li>`).join("")}</ul>
      <div class="botoes"><button class="primario" data-cl="aplicar" data-tarefa="${tarefa}">Aplicar as marcadas</button><button data-cl="descartar" data-tarefa="${tarefa}">Descartar</button></div>`
      : `<div class="extras">O Claude não viu nada para mudar.</div><div class="botoes"><button data-cl="descartar" data-tarefa="${tarefa}">Fechar</button></div>`;
    if (p.avisos && p.avisos.length) corpo += `<div class="cl-avisos">O painel ignorou ${p.avisos.length} sugestão(ões) que não passaram na conferência: ${esc(p.avisos.slice(0, 3).join("; "))}${p.avisos.length > 3 ? "..." : ""}</div>`;
  } else if (p && p.estado === "aplicada") corpo += `<div class="extras">Sugestão aplicada: ${p.aplicados.length} item(ns). Use Desfazer se não gostou.${p.falhas && p.falhas.length ? " Não deu para aplicar: " + esc(p.falhas.slice(0, 2).join("; ")) : ""}</div>`;
  const u = d.uso;
  if (u && u.pedidos) corpo += `<div class="cl-uso">Claude nesta edição: ${u.pedidos} pedido(s), ${u.entrada.toLocaleString("pt-BR")} de entrada e ${u.saida.toLocaleString("pt-BR")} de saída${u.custo_usd ? ` (≈ US$ ${num(u.custo_usd.toFixed(2))})` : ""}. A porcentagem do plano aparece no próprio Claude Code.</div>`;
  return corpo;
}
function desenharClaude() {
  document.querySelectorAll(".cl-caixa[data-cl-tarefa]").forEach((el) => { el.innerHTML = htmlClaude(el.dataset.clTarefa); });
}
async function tickClaude() {
  const pasta = pastaAberta();
  if (!pasta || !claudeLigado()) return;
  try {
    const d = await pegar(`/api/claude?pasta=${encodeURIComponent(pasta)}`);
    const chave = JSON.stringify([d.tarefas.map((t) => [t.rodando, t.erro, t.proposta && t.proposta.estado, t.proposta && t.proposta.criado_em]), d.uso, d.ocupado]);
    const mudou = pasta !== cl.pasta || chave !== cl.chave;
    cl.dados = d; cl.pasta = pasta; cl.chave = chave;
    const rodando = d.tarefas.some((t) => t.rodando);
    if (mudou || rodando) desenharClaude();
  } catch { /* a próxima volta tenta de novo */ }
}
async function recarregarTelaDoClaude(tarefa) {
  try {
    if (tarefa === "cortes" && rev.tipo === "cortes") rev.dados = await pegar(`/api/cortes?pasta=${encodeURIComponent(rev.pasta)}`), desenharRevisao();
    else if (tarefa === "grafia" && rev.tipo === "legenda") rev.dados = await pegar(`/api/legenda?pasta=${encodeURIComponent(rev.pasta)}`), desenharRevisao();
    else if (tarefa === "elementos" && aj.aba === "elementos") aj.dados.elementos = await pegar(`/api/elementos?pasta=${qs()}`), desenharAjustes();
  } catch (e) { aviso(e.message); }
}
document.addEventListener("click", async (ev) => {
  const b = ev.target.closest("button[data-cl]");
  if (!b) return;
  const pasta = pastaAberta(), d = b.dataset, tarefa = d.tarefa;
  try {
    if (d.cl === "ligar") { await api("/api/claude/ligar", {ligado: !(ultimoEstado.claude && ultimoEstado.claude.ligado)}); await atualizar(); return; }
    if (!pasta) return;
    if (d.cl === "pedir") { await api("/api/claude/pedir", {pasta, tarefa}); aviso("Pedido enviado ao Claude."); await tickClaude(); }
    else if (d.cl === "cancelar") { await api("/api/claude/cancelar", {}); await tickClaude(); }
    else if (d.cl === "descartar") { await api("/api/claude/descartar", {pasta, tarefa}); await tickClaude(); }
    else if (d.cl === "aplicar") {
      const itens = [...document.querySelectorAll(`.cl-caixa[data-cl-tarefa="${tarefa}"] input[data-cl-item]:checked`)].map((i) => i.dataset.clItem);
      if (!itens.length) { aviso("Marque pelo menos uma sugestão."); return; }
      const r = await api("/api/claude/aplicar", {pasta, tarefa, itens});
      aviso(`${r.aplicados} sugestão(ões) aplicada(s).` + (r.falhas && r.falhas.length ? " Algumas não deram: " + r.falhas[0] : ""));
      await recarregarTelaDoClaude(tarefa); await tickClaude();
    }
  } catch (e) { aviso(e.message); await tickClaude(); }
});
document.addEventListener("change", async (ev) => {
  const el = ev.target;
  if (el.dataset && el.dataset.clModelo !== undefined) {
    try { await api("/api/claude/ligar", {modelo: el.value}); await atualizar(); } catch (e) { aviso(e.message); }
    return;
  }
  const item = el.closest && el.closest("input[data-cl-item]");
  if (item) {
    const tarefa = item.closest(".cl-caixa").dataset.clTarefa;
    const set = cl.desmarcados[tarefa] = cl.desmarcados[tarefa] || new Set();
    if (item.checked) set.delete(item.dataset.clItem); else set.add(item.dataset.clItem);
  }
});
